name: Extension CI

on:
  push:
    branches: [main, 'agent/**']
  pull_request:

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec web-ext lint --source-dir dist --warnings-as-errors

  dev-watch-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Actually run normal pnpm dev without launching a browser
        shell: pwsh
        run: |
          $stdout = Join-Path $env:RUNNER_TEMP "context-capsule-dev-watch.stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "context-capsule-dev-watch.stderr.log"
          Remove-Item $stdout,$stderr -Force -ErrorAction SilentlyContinue

          $process = Start-Process `
            -FilePath $env:ComSpec `
            -ArgumentList '/d','/s','/c','pnpm dev' `
            -WorkingDirectory $PWD `
            -RedirectStandardOutput $stdout `
            -RedirectStandardError $stderr `
            -PassThru `
            -WindowStyle Hidden

          $deadline = (Get-Date).AddSeconds(30)
          $passed = $false
          $output = ""
          try {
            while ((Get-Date) -lt $deadline) {
              Start-Sleep -Milliseconds 300
              $output = ""
              if (Test-Path $stdout) { $output += Get-Content $stdout -Raw }
              if (Test-Path $stderr) { $output += "`n" + (Get-Content $stderr -Raw) }
              if ($output -match [regex]::Escape('[Context Capsule] Development watch ready.')) {
                $passed = $true
                break
              }
              if ($process.HasExited) { break }
            }

            if (-not $passed) {
              throw "pnpm dev did not reach the development-watch ready state."
            }
            if (-not (Test-Path 'dist/popup/context-capsule-logo.png')) {
              throw 'pnpm dev removed or failed to copy the popup/toolbar logo asset.'
            }
            $sourceSize = (Get-Item 'src/popup/context-capsule-logo.png').Length
            $distSize = (Get-Item 'dist/popup/context-capsule-logo.png').Length
            if ($sourceSize -ne $distSize) {
              throw "Development logo copy size mismatch: source=$sourceSize dist=$distSize"
            }
          }
          finally {
            if (-not $process.HasExited) {
              & taskkill.exe /PID $process.Id /T /F 2>$null | Out-Null
              $global:LASTEXITCODE = 0
            }
          }

          Write-Host $output
          if ($output -notmatch [regex]::Escape('does not launch or modify your Firefox/Zen profile')) {
            throw "pnpm dev did not report the existing-browser workflow."
          }
          Write-Host "Exact 'pnpm dev' watch-mode test passed with the logo present in dist."

  dev-isolated-firefox-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Ensure a real Firefox executable is available
        shell: pwsh
        run: |
          $candidates = @(
            "$env:ProgramW6432\Mozilla Firefox\firefox.exe",
            "$env:ProgramFiles\Mozilla Firefox\firefox.exe",
            "${env:ProgramFiles(x86)}\Mozilla Firefox\firefox.exe"
          ) | Where-Object { $_ -and (Test-Path $_) }
          $firefox = $candidates | Select-Object -First 1
          if (-not $firefox) {
            choco install firefox -y --no-progress
            $firefox = @(
              "$env:ProgramW6432\Mozilla Firefox\firefox.exe",
              "$env:ProgramFiles\Mozilla Firefox\firefox.exe",
              "${env:ProgramFiles(x86)}\Mozilla Firefox\firefox.exe"
            ) | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          }
          if (-not $firefox) { throw "Firefox installation was not found." }
          "CONTEXT_CAPSULE_BROWSER=$firefox" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Run isolated Firefox browser smoke
        shell: pwsh
        run: |
          pnpm dev:isolated -- --smoke

  dev-isolated-zen-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Install the latest official Zen Browser build
        shell: pwsh
        run: |
          $release = Invoke-RestMethod `
            -Uri "https://api.github.com/repos/zen-browser/desktop/releases/latest" `
            -Headers @{ "User-Agent" = "Context-Capsule-CI" }
          $asset = $release.assets | Where-Object { $_.name -eq "zen.installer.exe" } | Select-Object -First 1
          if (-not $asset) { throw "Latest Zen release does not contain zen.installer.exe." }
          $installer = Join-Path $env:RUNNER_TEMP "zen.installer.exe"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $installer
          $install = Start-Process -FilePath $installer -ArgumentList '/S' -Wait -PassThru
          if ($install.ExitCode -notin @(0, 3010, 1641)) {
            throw "Zen installer failed with exit code $($install.ExitCode)."
          }
          $zen = @(
            "$env:ProgramW6432\Zen Browser\zen.exe",
            "$env:ProgramFiles\Zen Browser\zen.exe",
            "${env:ProgramFiles(x86)}\Zen Browser\zen.exe",
            "$env:LOCALAPPDATA\Zen Browser\zen.exe",
            "$env:LOCALAPPDATA\Programs\Zen Browser\zen.exe"
          ) | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $zen) { throw "Zen installed but zen.exe was not found." }
          Write-Host "Using Zen: $zen"
          (Get-Item $zen).VersionInfo | Format-List FileVersion,ProductVersion
          "CONTEXT_CAPSULE_BROWSER=$zen" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Run isolated Zen browser smoke
        shell: pwsh
        run: |
          pnpm dev:isolated -- --smoke
