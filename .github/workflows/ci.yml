name: Extension CI

on:
  push:
    branches: [main, 'agent/**']
  pull_request:

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec web-ext lint --source-dir dist --warnings-as-errors

  dev-smoke-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Ensure a real Firefox executable is available
        shell: pwsh
        run: |
          $candidates = @(
            "$env:ProgramW6432\Mozilla Firefox\firefox.exe",
            "$env:ProgramFiles\Mozilla Firefox\firefox.exe",
            "${env:ProgramFiles(x86)}\Mozilla Firefox\firefox.exe"
          ) | Where-Object { $_ -and (Test-Path $_) }

          $firefox = $candidates | Select-Object -First 1
          if (-not $firefox) {
            choco install firefox -y --no-progress
            $candidates = @(
              "$env:ProgramW6432\Mozilla Firefox\firefox.exe",
              "$env:ProgramFiles\Mozilla Firefox\firefox.exe",
              "${env:ProgramFiles(x86)}\Mozilla Firefox\firefox.exe"
            ) | Where-Object { $_ -and (Test-Path $_) }
            $firefox = $candidates | Select-Object -First 1
          }

          if (-not $firefox) {
            throw "Firefox installation was not found after installation attempt."
          }

          Write-Host "Using Firefox: $firefox"
          (Get-Item $firefox).VersionInfo | Format-List FileVersion,ProductVersion
          "CONTEXT_CAPSULE_FIREFOX=$firefox" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Actually run normal pnpm dev and verify Firefox installs the extension
        shell: pwsh
        run: |
          $stdout = Join-Path $env:RUNNER_TEMP "context-capsule-pnpm-dev.stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "context-capsule-pnpm-dev.stderr.log"
          Remove-Item $stdout,$stderr -Force -ErrorAction SilentlyContinue

          $process = Start-Process `
            -FilePath $env:ComSpec `
            -ArgumentList '/d','/s','/c','pnpm dev' `
            -WorkingDirectory $PWD `
            -RedirectStandardOutput $stdout `
            -RedirectStandardError $stderr `
            -PassThru `
            -WindowStyle Hidden

          $deadline = (Get-Date).AddSeconds(45)
          $passed = $false
          $output = ""

          try {
            while ((Get-Date) -lt $deadline) {
              Start-Sleep -Milliseconds 500
              $output = ""
              if (Test-Path $stdout) { $output += Get-Content $stdout -Raw }
              if (Test-Path $stderr) { $output += "`n" + (Get-Content $stderr -Raw) }

              if ($output -match [regex]::Escape('[Context Capsule] Firefox launched and the temporary extension was installed.')) {
                $passed = $true
                break
              }

              if ($process.HasExited) {
                break
              }
            }
          }
          finally {
            if (-not $process.HasExited) {
              & taskkill.exe /PID $process.Id /T /F 2>$null | Out-Null
            }
          }

          Write-Host "----- pnpm dev output -----"
          Write-Host $output
          Write-Host "---------------------------"

          if (-not $passed) {
            if ($process.HasExited) {
              throw "pnpm dev exited before Firefox installed the temporary extension. Exit code: $($process.ExitCode)"
            }
            throw "pnpm dev did not install the temporary extension before the 45-second deadline."
          }

          Write-Host "Exact 'pnpm dev' launch test passed."
