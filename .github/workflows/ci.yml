name: Extension CI

on:
  push:
    branches: [main, 'agent/**']
  pull_request:

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec web-ext lint --source-dir dist --warnings-as-errors

  dev-smoke-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Ensure a real Firefox executable is available
        shell: pwsh
        run: |
          $candidates = @(
            "$env:ProgramW6432\Mozilla Firefox\firefox.exe",
            "$env:ProgramFiles\Mozilla Firefox\firefox.exe",
            "${env:ProgramFiles(x86)}\Mozilla Firefox\firefox.exe"
          ) | Where-Object { $_ -and (Test-Path $_) }

          $firefox = $candidates | Select-Object -First 1
          if (-not $firefox) {
            choco install firefox -y --no-progress
            $candidates = @(
              "$env:ProgramW6432\Mozilla Firefox\firefox.exe",
              "$env:ProgramFiles\Mozilla Firefox\firefox.exe",
              "${env:ProgramFiles(x86)}\Mozilla Firefox\firefox.exe"
            ) | Where-Object { $_ -and (Test-Path $_) }
            $firefox = $candidates | Select-Object -First 1
          }

          if (-not $firefox) {
            throw "Firefox installation was not found after installation attempt."
          }

          Write-Host "Using Firefox: $firefox"
          (Get-Item $firefox).VersionInfo | Format-List FileVersion,ProductVersion
          "CONTEXT_CAPSULE_BROWSER=$firefox" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Actually run normal pnpm dev and verify Firefox installs the extension
        shell: pwsh
        run: |
          $stdout = Join-Path $env:RUNNER_TEMP "context-capsule-pnpm-dev.stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "context-capsule-pnpm-dev.stderr.log"
          Remove-Item $stdout,$stderr -Force -ErrorAction SilentlyContinue

          $process = Start-Process `
            -FilePath $env:ComSpec `
            -ArgumentList '/d','/s','/c','pnpm dev' `
            -WorkingDirectory $PWD `
            -RedirectStandardOutput $stdout `
            -RedirectStandardError $stderr `
            -PassThru `
            -WindowStyle Hidden

          $deadline = (Get-Date).AddSeconds(45)
          $passed = $false
          $output = ""

          try {
            while ((Get-Date) -lt $deadline) {
              Start-Sleep -Milliseconds 500
              $output = ""
              if (Test-Path $stdout) { $output += Get-Content $stdout -Raw }
              if (Test-Path $stderr) { $output += "`n" + (Get-Content $stderr -Raw) }

              if ($output -match [regex]::Escape('[Context Capsule] Browser launch validation passed.')) {
                $passed = $true
                break
              }

              if ($process.HasExited) {
                break
              }
            }
          }
          finally {
            if (-not $process.HasExited) {
              & taskkill.exe /PID $process.Id /T /F 2>$null | Out-Null
            }
          }

          Write-Host "----- pnpm dev output -----"
          Write-Host $output
          Write-Host "---------------------------"

          if (-not $passed) {
            if ($process.HasExited) {
              throw "pnpm dev exited before Firefox installed the temporary extension. Exit code: $($process.ExitCode)"
            }
            throw "pnpm dev did not install the temporary extension before the 45-second deadline."
          }

          if ($output -notmatch [regex]::Escape('[Context Capsule] Using Firefox:')) {
            throw "pnpm dev did not select Firefox as requested."
          }

          Write-Host "Exact 'pnpm dev' Firefox launch test passed."

  dev-smoke-zen-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Install the latest official Zen Browser build and create an existing profile
        shell: pwsh
        run: |
          $release = Invoke-RestMethod `
            -Uri "https://api.github.com/repos/zen-browser/desktop/releases/latest" `
            -Headers @{ "User-Agent" = "Context-Capsule-CI" }
          $asset = $release.assets | Where-Object { $_.name -eq "zen.installer.exe" } | Select-Object -First 1
          if (-not $asset) {
            throw "Latest Zen release does not contain zen.installer.exe."
          }

          $installer = Join-Path $env:RUNNER_TEMP "zen.installer.exe"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $installer
          $install = Start-Process -FilePath $installer -ArgumentList '/S' -Wait -PassThru
          if ($install.ExitCode -notin @(0, 3010, 1641)) {
            throw "Zen installer failed with exit code $($install.ExitCode)."
          }

          $candidates = @(
            "$env:ProgramW6432\Zen Browser\zen.exe",
            "$env:ProgramFiles\Zen Browser\zen.exe",
            "${env:ProgramFiles(x86)}\Zen Browser\zen.exe",
            "$env:LOCALAPPDATA\Zen Browser\zen.exe",
            "$env:LOCALAPPDATA\Programs\Zen Browser\zen.exe"
          ) | Where-Object { $_ -and (Test-Path $_) }
          $zen = $candidates | Select-Object -First 1
          if (-not $zen) {
            throw "Zen installed successfully but zen.exe was not found in a supported location."
          }

          $profileRoot = Join-Path $env:APPDATA "zen"
          $profile = Join-Path $profileRoot "Profiles\context-capsule-ci.default-release"
          New-Item -ItemType Directory -Path $profile -Force | Out-Null
          Set-Content -Path (Join-Path $profile "prefs.js") -Encoding utf8 -Value @'
          user_pref("browser.shell.checkDefaultBrowser", false);
          user_pref("browser.startup.page", 0);
          '@
          Set-Content -Path (Join-Path $profileRoot "profiles.ini") -Encoding utf8 -Value @'
          [Profile0]
          Name=default-release
          IsRelative=1
          Path=Profiles/context-capsule-ci.default-release
          Default=1

          [InstallContextCapsuleCI]
          Default=Profiles/context-capsule-ci.default-release
          Locked=1
          '@

          Write-Host "Using Zen: $zen"
          Write-Host "Existing Zen profile: $profile"
          (Get-Item $zen).VersionInfo | Format-List FileVersion,ProductVersion
          "CONTEXT_CAPSULE_BROWSER=$zen" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CONTEXT_CAPSULE_EXPECTED_PROFILE=$profile" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Actually run normal pnpm dev through Zen Browser using the existing profile as a safe copy
        shell: pwsh
        run: |
          $stdout = Join-Path $env:RUNNER_TEMP "context-capsule-zen-dev.stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "context-capsule-zen-dev.stderr.log"
          Remove-Item $stdout,$stderr -Force -ErrorAction SilentlyContinue

          $process = Start-Process `
            -FilePath $env:ComSpec `
            -ArgumentList '/d','/s','/c','pnpm dev' `
            -WorkingDirectory $PWD `
            -RedirectStandardOutput $stdout `
            -RedirectStandardError $stderr `
            -PassThru `
            -WindowStyle Hidden

          $deadline = (Get-Date).AddSeconds(60)
          $passed = $false
          $output = ""

          try {
            while ((Get-Date) -lt $deadline) {
              Start-Sleep -Milliseconds 500
              $output = ""
              if (Test-Path $stdout) { $output += Get-Content $stdout -Raw }
              if (Test-Path $stderr) { $output += "`n" + (Get-Content $stderr -Raw) }

              if ($output -match [regex]::Escape('[Context Capsule] Browser launch validation passed.')) {
                $passed = $true
                break
              }

              if ($process.HasExited) {
                break
              }
            }
          }
          finally {
            if (-not $process.HasExited) {
              & taskkill.exe /PID $process.Id /T /F 2>$null | Out-Null
            }
          }

          Write-Host "----- Zen pnpm dev output -----"
          Write-Host $output
          Write-Host "--------------------------------"

          if (-not $passed) {
            if ($process.HasExited) {
              throw "pnpm dev exited before Zen installed the temporary extension. Exit code: $($process.ExitCode)"
            }
            throw "pnpm dev did not install the temporary extension in Zen before the 60-second deadline."
          }

          if ($output -notmatch [regex]::Escape('[Context Capsule] Using Zen Browser:')) {
            throw "pnpm dev did not select Zen Browser as requested."
          }

          $expectedProfileMessage = "[Context Capsule] Using Zen Browser profile as isolated base: $env:CONTEXT_CAPSULE_EXPECTED_PROFILE"
          if ($output -notmatch [regex]::Escape($expectedProfileMessage)) {
            throw "pnpm dev did not discover and reuse the existing Zen profile as its isolated base."
          }

          if ($output -notmatch [regex]::Escape('your real daily profile is not modified')) {
            throw "pnpm dev did not report isolated profile-copy behavior."
          }

          Write-Host "Exact 'pnpm dev' Zen Browser existing-profile test passed."
