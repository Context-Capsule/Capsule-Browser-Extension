name: Apply Zen Restore Regression Fix

on:
  push:
    branches: ['feature/chrome-build-target-20260822']
    paths: ['.github/workflows/apply-chrome-pinned-restore-fix.yml']

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Verify POTUS runner
        shell: pwsh
        run: |
          if ('${{ runner.name }}' -ne 'POTUS') { throw "Expected runner POTUS, got '${{ runner.name }}'" }
      - uses: actions/checkout@v4
        with:
          ref: feature/chrome-build-target-20260822
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: corepack enable
      - name: Apply regression patch
        run: python scripts/apply-zen-restore-regression.py
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build:firefox
      - run: pnpm exec web-ext lint --source-dir dist --warnings-as-errors
      - run: pnpm build:chrome
      - run: pnpm test:build-targets
      - name: Commit only after verification passes
        shell: pwsh
        run: |
          git rm .github/workflows/apply-chrome-pinned-restore-fix.yml scripts/apply-zen-restore-regression.py
          git add src/browser/restore.ts tests/index.ts
          git config user.name 'GPT-Slave'
          git config user.email '313162660+GPT-Slave@users.noreply.github.com'
          git commit -m 'fix: restore partial Zen window topology safely'
          if ($LASTEXITCODE -ne 0) { throw 'git commit failed' }
          git push origin HEAD:feature/chrome-build-target-20260822
          if ($LASTEXITCODE -ne 0) { throw 'git push failed' }
